aid: cybervadis
name: CyberVadis
description: >-
  CyberVadis is a Third-Party Cyber Risk Management (TPCRM) platform that runs
  evidence-based cybersecurity assessments of vendors and suppliers at scale. Its
  assessment methodology maps to global frameworks and standards including NIST,
  ISO 27001, DORA, NIS2 and GDPR, producing standardized security ratings,
  prioritized improvement plans, and continuous monitoring with external attack
  surface management (EASM). CyberVadis pairs a managed assessment service with a
  self-service platform offering SSO, unlimited users, and API/GRC integrations
  (for example ServiceNow) so organizations can embed third-party risk workflows
  into existing systems. Part of the EcoVadis group and backed by Partech. The
  platform exposes an enterprise, contract-gated API (a monitored "API
  Integrations" component on its public status page) but publishes no open
  developer portal, OpenAPI, or SDK.
